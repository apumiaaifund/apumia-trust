<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apumia Trust Engine — Live Sandbox</title><style>body{font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb;max-width:780px;margin:32px auto;padding:0 16px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:18px}textarea{width:100%;height:96px;background:#030712;color:#a7f3d0;border:1px solid #374151;border-radius:8px;padding:10px;font-family:monospace;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:10px}.ok{color:#34d399;font-weight:700;margin-top:12px}.bad{color:#f87171;font-weight:700;margin-top:12px}a{color:#60a5fa;text-decoration:none;font-size:13px}</style></head><body><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b>🛡 Apumia Trust Engine Live Sandbox</b><a href="https://github.com" target="_blank">← Портфель GitHub ↗</a></div><div class="card"><h1 style="margin:0 0 8px;font-size:22px">Apumia Trust Engine</h1><p style="color:#9ca3af;font-size:14px">Оценка уровня доверия (Zero-Trust Score) и проверка цифровых подписей. (Zero-Trust: расчёт локально в браузере).</p><textarea id="inp">{"actor":"partner-api","mfa":true,"cert_valid":true}</textarea><button onclick="chk()">Проверить данные</button><div id="res" class="ok">Готов к локальной проверке</div></div><script>function chk(){const r=document.getElementById("res");try{const d=JSON.parse(document.getElementById("inp").value);const bad=Object.values(d).some(v=>v===false||(typeof v==="number"&&v<0));r.className=bad?"bad":"ok";r.textContent=(bad?"⛔ BLOCKED (Fail-Closed): обнаружено нарушение инварианта":"✅ VERIFIED & SIGNED: политика соблюдена (0.4 ms)")}catch(e){r.className="bad";r.textContent="⛔ Ошибка JSON: "+e.message}}</script></body></html>
